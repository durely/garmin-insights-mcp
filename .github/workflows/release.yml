name: Release

# Runs when a version tag is pushed: git tag v0.5.0 && git push origin v0.5.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, to check the tagged commit is on main
      # A tag can point at any commit; only release what's on main. npm and docker both wait for this job.
      - name: Tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that isn't on main. Tag a commit on main instead."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Tag matches the package, server and server.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          server="$(node dist/index.js --version)"
          registry="$(jq -r '[.version, .packages[0].version, (.packages[1].identifier | split(":")[1])] | unique | join(" ")' server.json)"
          echo "tag=$tag package.json=$pkg server=$server server.json=$registry"
          test "$tag" = "$pkg" && test "$tag" = "$server" && test "$tag" = "$registry"

  npm:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # Trusted publishing: npm authenticates this workflow over OIDC, so there's no token to store.
      - run: npm publish --access public --provenance

  docker:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the workflow's own token
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  registry:
    needs: [npm, docker] # the registry checks the npm package and the image, so both must be published first
    runs-on: ubuntu-latest
    # MCP_PRIVATE_KEY is a secret on this environment, limited to v* tags, so only release runs can read it.
    environment: mcp-registry
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/mcp-publisher
      # app.durely/* is proven with an Ed25519 key whose public half is a TXT record on durely.app.
      - run: ./mcp-publisher login dns --domain durely.app --private-key "$MCP_PRIVATE_KEY"
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
      # npm can take a minute to serve a version it just accepted, and the registry checks it right away.
      - name: Wait until npm serves this version
        run: |
          url="https://registry.npmjs.org/@durely%2Fgarmin-insights-mcp/${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 30); do curl --fail --silent --output /dev/null "$url" && exit 0; sleep 10; done
          echo "::error::npm still doesn't serve ${GITHUB_REF_NAME#v} after 5 minutes"
          exit 1
      - run: ./mcp-publisher publish
